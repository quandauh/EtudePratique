{% extends "base.html" %}
{% load static %}

{% block title %}{{ item.name }}{% endblock %}


{% block content %}
  <form action="{% url "app:guess" %}" class="flex-center" method="post">
    {% csrf_token %}
    <div class="row align-items-center vh-60 gx-5">
      <div class="col d-none d-lg-block align-self-end ">
        <img src="{% static "img/albert.png" %}" alt="Albert Einstein">
      </div>
      <div class="col vw-90 mx-3 px-md-5 py-3 rounded-5 shadow-lg border border-secondary-subtle">
        <h3 class="mb-4">J'ai trouvé !</h3>
        <h3 class="mb-5">Je pense à {{ item.name }}</h3>
        {% if item.image %}
          <img class="d-block mx-auto mb-5 img-fluid rounded-4" src="{{ item.image }}" alt="{{ item.name }}" style="max-height: 400px;">
        {% endif %}
        <div class="d-flex justify-content-evenly">
          <button class="btn btn-primary btn-lg" name="choice" type="submit" value="y">Oui</button>
          <button class="btn btn-primary btn-lg" name="choice" type="submit" value="n">Non</button>
        </div>
      </div>
      <div class="col d-none d-lg-block align-self-start">
        <img src="{% static "img/idea.png" %}" alt="idea">
      </div>
    </div>
  </form>
{% endblock %}
