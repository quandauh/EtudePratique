{% extends "admin/admin_base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <form action="{% url "admin:login" %}" class="flex-center" method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p>Votre nom d'utilisateur et votre mot de passe ne correspondent pas. Veuillez réessayer.</p>
    {% endif %}
    <div class="form-floating">
      <input autocapitalize="none" autocomplete="username" autofocus class="form-control bg-secondary-subtle"
             id="id_username" maxlength="150" name="username" placeholder="Username" required type="text">
      <label for="id_username" id="label_username">Nom d’utilisateur :</label>
    </div>
    <div class="form-floating mt-3">
      <input autocomplete="current-password" class="form-control bg-secondary-subtle"
             id="id_password" maxlength="150" name="password" placeholder="Password" required type="password">
      <label for="id_password" id="label_password">Mot de passe :</label>
    </div>

    <button class="btn btn-primary mt-3" name="login" type="submit">Valider</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}
