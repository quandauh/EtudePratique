{% extends "admin/admin_base.html" %}
{% load static %}

{% block title %}Personnages{% endblock %}

{% block content %}
  <form class="d-flex flex-column align-items-center" method="post">
    {% csrf_token %}
    <label for="select_item" id="label_item">Choisissez un personnage :</label>
    <select id="select_item" name="id_item" data-live-search="true" class="selectpicker" data-width="75%">
      {% for item in items %}
        <option value="{{ item.id }}">{{ item.name }}</option>
      {% endfor %}
    </select>
    <label for="num_questions" id="label_num">Nombre de questions :</label>
    <input min="1" id="num_questions" name="num_questions" required type="number" value="5" aria-label="Nombre de questions à afficher">
    <button class="btn btn-primary mt-3" type="submit">Valider</button>
  </form>
{% endblock %}

{% block script %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">

<!-- Latest compiled and minified JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
{% endblock %}
