{% extends "admin/admin_base.html" %}
{% load static %}

{% block title %}Renommer{% endblock %}

{% block content %}
    <form class="flex-center" method="post">
        {% csrf_token %}
        <div class="text-center px-md-5 py-3 rounded-5 shadow-lg border border-secondary-subtle">
            <h2 class="mb-4">Renommer</h2>
            {% for error in errors %}
                    <h4 style="color: red;" class="mb-4">{{ error }}</h4>
            {% endfor %}
            {{ form }}
            <button class="btn btn-primary btn-lg" type="submit">Valider</button>
            <a href="{% url "admin:character_details" current_item.id %}" class="btn btn-primary btn-lg">Annuler</a>
        </div>
    </form>
{% endblock %}

{% block script %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">

<!-- Latest compiled and minified JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
{% endblock %}
