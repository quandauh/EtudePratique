upstream django {
	server		unix:/run/uwsgi/devinsa.sock;
}

server {
	listen		443	ssl http2;
	ssl_certificate		/etc/ssl/certs/nginx-selfsigned.crt;
	ssl_certificate_key	/etc/ssl/private/nginx-selfsigned.key;

	server_name	devinsa.insa-rennes.fr vps-devinsa.insa-rennes.fr;
	charset		utf-8;

	location /static/ {
		alias	/var/www/devinsa.insa-rennes.fr/src/static/;
	}

	location / {
		uwsgi_pass django;
		include	/etc/nginx/uwsgi_params;
	}
}

server {
	listen	80;
	server_name	devinsa.insa-rennes.fr vps-devinsa.insa-rennes.fr;
	return	301	https://$host$request_uri;
}
