[uwsgi]
strict		= true
vacuum		= true
single-interpreter	= true
die-on-term	= true
need-app	= true
auto-procname	= true
single-interpreter	= true

# Django-related settings
# the base directory (full path)
chdir           = /var/www/devinsa.insa-rennes.fr/src
# Django's wsgi file
module          = devinsa.wsgi
# the virtualenv (full path)
home            = /var/www/devinsa.insa-rennes.fr/.venv

# process-related settings
master		= true
enable-threads	= true
thunder-lock	= true
processes	= 2
threads		= 2
# the socket
socket		= /var/run/uwsgi/devinsa.sock
gid		= www-data
uid		= www-data
chmod-socket    = 664

# logging
disable-logging = true
log-4xx         = true
log-5xx         = true
